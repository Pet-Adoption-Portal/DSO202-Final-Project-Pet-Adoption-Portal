# nginx config for the frontend container (service #1).
# Listens on 8080 so the container can run as a non-root user (Pod Security "restricted").
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness probe target. Never touches anything else.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # Basic connection counters; nginx-prometheus-exporter can turn this into /metrics later.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }

    # config.js is replaced per environment by a ConfigMap, so never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Static assets: cache for a day.
    location ~* \.(css|js|svg|png|jpg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # For running this container alone with docker (no Ingress), uncomment to send
    # /api to the gateway. In Kubernetes the Ingress routes /api to api-gateway directly.
    # location /api/ {
    #     proxy_pass http://api-gateway:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Request-Id $request_id;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
